<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini E-Commerce App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🛍️ Mini Store</h1>
        <button id="cartButton">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>
    </header>

    <main>
        <h2>Our Products</h2>

        <div id="productList" class="product-list"></div>
    </main>

    <!-- Cart -->
    <div id="cartModal" class="modal">
        <div class="modal-content">

            <span id="closeCart" class="close">&times;</span>

            <h2>Shopping Cart</h2>

            <div id="cartItems"></div>

            <h3>
                Total: ₹<span id="cartTotal">0</span>
            </h3>

            <button id="checkoutButton" class="checkout">
                Checkout
            </button>

        </div>
    </div>

    <!-- Checkout -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">

            <span id="closeCheckout" class="close">&times;</span>

            <h2>Checkout Preview</h2>

            <div id="checkoutDetails"></div>

            <button id="placeOrder" class="checkout">
                Place Order
            </button>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
